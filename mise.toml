min_version = "2026.7.18"

[settings]
auto_install = false
lockfile = true
locked = true

[env]
_.path = ["/usr/lib/llvm-18/bin"]

[tools]
rust = { version = "stable", profile = "minimal", components = [
  "clippy",
  "rustfmt",
  "llvm-tools",
], targets = [
  "wasm32-unknown-unknown",
  "x86_64-pc-windows-msvc",
] }
just = "1.56.0"
taplo = "0.10.0"
rumdl = "0.2.41"
ast-grep = "0.44.1"
buf = "1.72.0"
protoc = "35.1"
"cargo-binstall" = "1.21.1"
"cargo:dioxus-cli" = { version = "0.7.10", depends = [
  "rust",
  "cargo-binstall",
] }
"cargo:dx-story-cli" = { version = "0.1.0", depends = [
  "rust",
  "cargo-binstall",
] }
"cargo:cargo-nextest" = { version = "0.9.143", depends = [
  "rust",
  "cargo-binstall",
] }
"cargo:cargo-llvm-cov" = { version = "0.8.7", depends = [
  "rust",
  "cargo-binstall",
] }
"cargo:cargo-xwin" = { version = "0.22.0", depends = [
  "rust",
  "cargo-binstall",
] }
"cargo:tauri-driver" = { version = "2.0.6", depends = [
  "rust",
  "cargo-binstall",
] }
"cargo:tauri-cli" = { version = "2.11.4", depends = ["rust", "cargo-binstall"] }

[tools."http:zig"]
version = "0.16.0"
strip_components = 1

[tools."http:zig".platforms]
linux-x64 = { url = "https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz", checksum = "sha256:70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00" }
macos-x64 = { url = "https://ziglang.org/download/0.16.0/zig-x86_64-macos-0.16.0.tar.xz", checksum = "sha256:0387557ed1877bc6a2e1802c8391953baddba76081876301c522f52977b52ba7" }
macos-arm64 = { url = "https://ziglang.org/download/0.16.0/zig-aarch64-macos-0.16.0.tar.xz", checksum = "sha256:b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489" }

[bootstrap.packages]
"apt:build-essential" = "latest"
"apt:ca-certificates" = "latest"
"apt:curl" = "latest"
"apt:dbus-daemon" = "latest"
"apt:file" = "latest"
"apt:git" = "latest"
"apt:libayatana-appindicator3-dev" = "latest"
"apt:libdbus-1-dev" = "latest"
"apt:libgtk-3-dev" = "latest"
"apt:librsvg2-dev" = "latest"
"apt:libssl-dev" = "latest"
"apt:libwebkit2gtk-4.1-dev" = "latest"
"apt:libxdo-dev" = "latest"
"apt:llvm" = "latest"
"apt:nsis" = "latest"
"apt:openbox" = "latest"
"apt:pkg-config" = "latest"
"apt:stalonetray" = "latest"
"apt:webkit2gtk-driver" = "latest"
"apt:wget" = "latest"
"apt:x11-utils" = "latest"
"apt:xdotool" = "latest"
"apt:xvfb" = "latest"
"apt:zip" = "latest"
"apt:zsh" = "latest"

[bootstrap.mise_shell_activate]
zshrc = "activate"

[tasks.bootstrap]
description = "Configure this clone, build, and install git-tools"
run = "just setup"

[package]
name = "gtl-benchmarks"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
bench = false

[[bench]]
name = "app_state_record_render"
harness = false

[[bench]]
name = "app_state_mutations"
harness = false

[[bench]]
name = "view_cache"
harness = false

[[bench]]
name = "viewer_render"
harness = false

[[bench]]
name = "parser_syntax"
harness = false

[[bench]]
name = "grpc_requests"
harness = false

[[bench]]
name = "story_set_registry"
harness = false

[[bench]]
name = "user_settings"
harness = false

[[bin]]
name = "server-highlighting-driver"
path = "src/bin/server_highlighting_driver/main.rs"

[[bin]]
name = "grpc-transport-driver"
path = "src/bin/grpc_transport_driver/main.rs"

[[bin]]
name = "view-source-driver"
path = "src/bin/view_source_driver/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
gtl-client.workspace = true
gtl-application.workspace = true
gtl-infra.workspace = true
gtl-local-transport.workspace = true
gtl-models.workspace = true
gtl-wire = { workspace = true, features = ["grpc"] }
libc.workspace = true
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sysinfo.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
toml.workspace = true
tonic = { workspace = true, features = ["transport"] }

[dev-dependencies]
criterion = { workspace = true, features = ["async_tokio"] }
dx-story = { workspace = true, features = ["benchmark-support"] }
gtl-server = { workspace = true, features = ["benchmark-support"] }
gtl-artifacts.workspace = true
gtl-parser = { workspace = true, features = ["syntax"] }

[lints]
workspace = true

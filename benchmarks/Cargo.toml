[package]
name = "gtl-benchmarks"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[[bench]]
name = "app_state_record_render"
harness = false

[[bench]]
name = "view_cache"
harness = false

[[bench]]
name = "viewer_render"
harness = false

[[bench]]
name = "parser_syntax"
harness = false

[dependencies]
clap.workspace = true

[dev-dependencies]
criterion.workspace = true
gtl-application.workspace = true
gtl-models.workspace = true
gtl-wire.workspace = true
# The view-cache target benchmarks the desktop-owned cache without exposing it in production builds.
gtl-desktop = { workspace = true, features = ["benchmark-support"] }
gtl-infra.workspace = true
gtl-artifacts.workspace = true
gtl-parser = { workspace = true, features = ["syntax"] }
tempfile.workspace = true

[lints]
workspace = true

[package]
name = "gtl-benchmarks"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lib]
bench = false

[[bench]]
name = "app_state_record_render"
harness = false

[[bench]]
name = "view_cache"
harness = false

[[bench]]
name = "viewer_render"
harness = false

[[bench]]
name = "parser_syntax"
harness = false

[[bench]]
name = "grpc_requests"
harness = false

[dependencies]
serde.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
criterion = { workspace = true, features = ["async_tokio"] }
gtl-application.workspace = true
gtl-client.workspace = true
gtl-models.workspace = true
gtl-wire = { workspace = true, features = ["grpc"] }
# The view-cache target benchmarks the desktop-owned cache without exposing it in production builds.
gtl-desktop = { workspace = true, features = ["benchmark-support"] }
gtl-server = { workspace = true, features = ["benchmark-support"] }
gtl-infra.workspace = true
gtl-artifacts.workspace = true
gtl-parser = { workspace = true, features = ["syntax"] }
prost.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true

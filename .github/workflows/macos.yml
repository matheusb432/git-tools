name: macos

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Mac architecture to build and exercise
        type: choice
        default: macos-15
        options:
          - macos-15
          - macos-15-intel

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}-${{ inputs.runner }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: tools/git-tools
    env:
      MISE_ENV: ci
      NEXTEST_PROFILE: ci
      CARGO_BUILD_JOBS: 3
    steps:
      - uses: actions/checkout@v7
        with:
          path: tools/git-tools
          persist-credentials: false
      - name: Check out the pinned story dependency
        uses: actions/checkout@v7
        with:
          repository: matheusb432/dx-preview-private
          ref: d57e69118066593e24a86c1703d1c6b6938043cb
          path: shared-libs/dx-story
          ssh-key: ${{ secrets.DX_STORY_READ_KEY }}
          persist-credentials: false
      - uses: jdx/mise-action@v4
        with:
          version: 2026.7.18
          working_directory: tools/git-tools
          install_args: rust just protoc cargo-binstall cargo:dioxus-cli cargo:tauri-cli cargo:cargo-nextest deno
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/git-tools
          cache-bin: false
          cache-on-failure: true
      - name: Build and package all components
        id: build
        run: just desktop package-macos
      - name: Install the package
        run: sudo /usr/sbin/installer -pkg .artifacts/macos/git-tools-*.pkg -target /
      - name: Exercise the installed package
        run: just desktop smoke-macos
      - name: Upload installer and launch evidence
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: git-tools-${{ inputs.runner }}-${{ github.sha }}
          path: tools/git-tools/.artifacts/macos/
          if-no-files-found: error
          retention-days: 7
      - name: Test native components
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          just test
          just test -p gtl-desktop
      - name: Clean up the launch agent and viewer
        if: always()
        run: |
          launchctl bootout "gui/$(id -u)/gtl-server" 2>/dev/null || true
          pkill -x gtl-viewer || true

name: macos

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      NEXTEST_PROFILE: ci
      CARGO_BUILD_JOBS: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
        with:
          version: 2026.7.18
          install_args: rust just protoc cargo-binstall cargo:dioxus-cli cargo:tauri-cli cargo:cargo-nextest http:zig
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          cache-on-failure: true
      - name: Build and package all components
        id: build
        run: just desktop package-macos
      - name: Install the package
        run: sudo /usr/sbin/installer -pkg .artifacts/macos/git-tools-*.pkg -target /
      - name: Exercise the installed package
        run: just desktop smoke-macos
      - name: Test native components
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          just test
          just test -p gtl-desktop
      - name: Upload verified Apple Silicon installer
        uses: actions/upload-artifact@v7
        with:
          name: git-tools-macos-arm64-${{ github.sha }}
          path: |
            .artifacts/macos/*-arm64.pkg
            .artifacts/macos/*-arm64.pkg.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Clean up the launch agent and viewer
        if: always()
        run: |
          launchctl bootout "gui/$(id -u)/gtl-server" 2>/dev/null || true
          pkill -x gtl-viewer || true

name: linux

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      MISE_ENV: ci
      NEXTEST_PROFILE: ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Ubuntu build and desktop-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential dbus-daemon file libayatana-appindicator3-dev \
            libdbus-1-dev libgtk-3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev \
            llvm-18 clang-18 lld-18 openbox pkg-config stalonetray webkit2gtk-driver \
            x11-utils xdotool xvfb zip zsh
      - uses: jdx/mise-action@v4
        with:
          version: 2026.7.18
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          cache-on-failure: true
      - name: Check formatting, architecture, and lints
        run: just check
      - name: Run the complete Ubuntu verification suite
        run: just test-all
      - name: Build and package every application component
        run: |
          just build
          just package linux
      - name: Exercise the extracted executables outside the checkout
        run: |
          mkdir -p .artifacts/extracted
          tar -xzf .artifacts/linux/git-tools-*-linux-x86_64.tar.gz -C .artifacts/extracted
          bash release/linux/smoke.sh .artifacts/extracted/git-tools-*-linux-x86_64
      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: git-tools-linux-x86_64-${{ github.sha }}
          path: |
            .artifacts/linux/*.tar.gz
            .artifacts/linux/*.sha256
          if-no-files-found: error
          retention-days: 14

name: windows

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install cross-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libayatana-appindicator3-dev libdbus-1-dev \
            libgtk-3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev \
            llvm-18 clang-18 lld-18 pkg-config zip
      - uses: jdx/mise-action@v4
        with:
          version: 2026.7.18
          install_args: rust just protoc cargo-binstall cargo:dioxus-cli cargo:cargo-nextest cargo:cargo-xwin http:zig
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          cache-on-failure: true
      - name: Build application and native test archive
        run: |
          just ship --force
          just check-windows
          just archive-windows-tests
          just package windows
      - name: Upload candidates for native verification
        uses: actions/upload-artifact@v7
        with:
          name: windows-candidate-${{ github.sha }}
          path: .artifacts/windows/
          if-no-files-found: error
          retention-days: 7

  verify:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: windows-candidate-${{ github.sha }}
          path: .artifacts/windows
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.143
      - name: Extract application archive
        shell: bash
        run: |
          unzip -q .artifacts/windows/git-tools-*-windows-x86_64.zip -d .artifacts/extracted
          mv .artifacts/extracted/git-tools-* .artifacts/install
          echo "GTL_CLI_TEST_BINARY=$(cygpath -w "$PWD/.artifacts/install/git-tools.exe")" >> "$GITHUB_ENV"
          touch .artifacts/empty.gitconfig
          echo "GIT_CONFIG_GLOBAL=$(cygpath -w "$PWD/.artifacts/empty.gitconfig")" >> "$GITHUB_ENV"
          echo "GIT_CONFIG_NOSYSTEM=1" >> "$GITHUB_ENV"
      - name: Execute native Windows unit and integration tests
        shell: bash
        run: cargo nextest run --archive-file .artifacts/windows/tests.tar.zst --workspace-remap "$PWD" --profile ci
      - name: Exercise installation, daemon, CLI, and viewer
        shell: cmd
        run: call release\windows\smoke.cmd "%CD%\.artifacts\install"
      - name: Upload verified release archive
        uses: actions/upload-artifact@v7
        with:
          name: git-tools-windows-x86_64-${{ github.sha }}
          path: |
            .artifacts/windows/*.zip
            .artifacts/windows/*.sha256
          if-no-files-found: error
          retention-days: 14

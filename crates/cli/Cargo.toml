[package]
name = "cli"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "git-tools"
path = "src/main.rs"

[lib]
name = "git_tools"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
application = { path = "../application" }
clap = { version = "4", features = ["derive"] }
domain = { path = "../domain" }
gtl-platform = { path = "../../shared/gtl-platform" }
infra = { path = "../infra" }
jiff = { version = "0.2", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.18"
toml = "1.1.2"
toml_edit = "0.25.12"
walkdir = "2.5.0"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

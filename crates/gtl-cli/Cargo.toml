[package]
name = "gtl-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "git-tools"
path = "src/main.rs"

[lib]
name = "gtl_cli"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
clap-cargo.workspace = true
dialoguer.workspace = true
crossterm = { version = "0.29.0", default-features = false, features = [
  "event-stream",
] }
futures-util.workspace = true
ratatui = { version = "0.30.2", default-features = false, features = [
  "crossterm",
] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
gtl-client.workspace = true
gtl-local-transport.workspace = true
gtl-wire = { workspace = true, features = ["grpc"] }
gtl-models.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
assert_cmd.workspace = true
gtl-server = { workspace = true, features = ["benchmark-support"] }
predicates.workspace = true
strum.workspace = true
tempfile.workspace = true
tonic.workspace = true

[target.'cfg(unix)'.dev-dependencies]
expectrl.workspace = true
vt100 = "0.16.2"

[target.'cfg(unix)'.dependencies]
# Level-triggered polling keeps burst input readable after Crossterm's 1 KiB read buffer fills.
crossterm = { version = "0.29.0", default-features = false, features = [
  "use-dev-tty",
] }

[lints]
workspace = true

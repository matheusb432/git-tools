[package]
name = "gtl-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
directories.workspace = true
gtl-application.workspace = true
gtl-artifacts.workspace = true
gtl-infra.workspace = true
gtl-local-auth.workspace = true
gtl-models.workspace = true
gtl-wire = { workspace = true, features = ["grpc"] }
libc.workspace = true
prost.workspace = true
rolling-file.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = [
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tonic = { workspace = true, features = ["router", "transport"] }
tonic-health.workspace = true
tonic-reflection.workspace = true
tonic-web.workspace = true
tokio-stream.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber = { workspace = true, features = ["json"] }

[dev-dependencies]
gtl-application = { workspace = true, features = ["testing"] }
prost-types.workspace = true
serde_json.workspace = true
serial_test.workspace = true
tempfile.workspace = true

[features]
benchmark-support = []

[lints]
workspace = true

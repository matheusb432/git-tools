[package]
name = "daemon"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "gtl-daemon"
path = "src/main.rs"

[dependencies]
anyhow = "1"
application = { path = "../application" }
axum = "0.8"
bootstrap = { path = "../../shared/bootstrap" }
contracts = { path = "../contracts" }
domain = { path = "../domain" }
gtl-platform = { path = "../../shared/gtl-platform" }
infra = { path = "../infra" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tracing = "0.1"

[dev-dependencies]
application = { path = "../application", features = ["testing"] }
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true

syntax = "proto3";

package gtl.v1;

import "gtl/v1/common.proto";
import "gtl/v1/diff.proto";

service LiveViewService {
  rpc SaveAndPresentLiveView(SaveAndPresentLiveViewRequest) returns (SaveAndPresentLiveViewResponse);
  rpc SaveAndPresentProjectLiveViews(SaveAndPresentProjectLiveViewsRequest) returns (SaveAndPresentProjectLiveViewsResponse);
}

message SaveAndPresentLiveViewRequest {
  string path = 1;
  bool open_viewer = 2;
}

enum SaveLiveViewDisposition {
  SAVE_LIVE_VIEW_DISPOSITION_UNSPECIFIED = 0;
  SAVE_LIVE_VIEW_DISPOSITION_CREATED = 1;
  SAVE_LIVE_VIEW_DISPOSITION_REFRESHED = 2;
}

message SavedLiveView {
  string repository_root = 1;
  string display_name = 2;
  SaveLiveViewDisposition disposition = 3;
}

enum SaveLiveViewRejectionCode {
  SAVE_LIVE_VIEW_REJECTION_CODE_UNSPECIFIED = 0;
  SAVE_LIVE_VIEW_REJECTION_CODE_DIRECTORY_NOT_FOUND = 1;
  SAVE_LIVE_VIEW_REJECTION_CODE_NOT_A_GIT_REPOSITORY = 2;
}

message SaveLiveViewRejection {
  SaveLiveViewRejectionCode code = 1;
  string detail = 2;
}

message SaveLiveViewResponse {
  repeated Note notes = 1;

  oneof outcome {
    SavedLiveView saved = 2;
    SaveLiveViewRejection rejected = 3;
  }
}

message SaveAndPresentLiveViewResponse {
  SaveLiveViewResponse result = 1;
  optional DiffPresentation presentation = 2;
}

message SaveAndPresentProjectLiveViewsRequest {
  bool open_viewer = 1;
}

message SaveAndPresentProjectLiveViewsResponse {
  repeated Note notes = 3;
  repeated SaveLiveViewResponse results = 1;
  optional DiffPresentation presentation = 2;
}

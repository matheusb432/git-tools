syntax = "proto3";

package gtl.v1;

import "gtl/v1/common.proto";

service RepositoryService {
  rpc PlanRepositoryPush(PlanRepositoryPushRequest) returns (PlanRepositoryPushResponse);
  rpc ExecuteRepositoryPush(ExecuteRepositoryPushRequest) returns (ExecuteRepositoryPushResponse);
  rpc PlanRepositoryCommit(PlanRepositoryCommitRequest) returns (PlanRepositoryCommitResponse);
  rpc ExecuteRepositoryCommit(ExecuteRepositoryCommitRequest) returns (ExecuteRepositoryCommitResponse);
  rpc PlanRecursiveRepositoryPush(PlanRecursiveRepositoryPushRequest) returns (PlanRecursiveRepositoryPushResponse);
  rpc ExecuteRecursiveRepositoryPush(ExecuteRecursiveRepositoryPushRequest) returns (ExecuteRecursiveRepositoryPushResponse);
  rpc GetRepositoryStatus(GetRepositoryStatusRequest) returns (GetRepositoryStatusResponse);
  rpc GetRecursiveRepositoryStatuses(GetRecursiveRepositoryStatusesRequest) returns (GetRecursiveRepositoryStatusesResponse);
}

message OperationDetail {
  string detail = 1;
}

message PendingChanges {
  uint64 changed_paths = 1;
  uint64 staged_paths = 2;
  uint64 unprepared_paths = 3;
  uint64 commits_ahead = 4;
}

message RepositoryPushTarget {
  string project_name = 1;
  string repository_root = 2;
  string branch = 3;
  string remote = 4;
  reserved 5;
  reserved "remote_url";
  repeated string remote_urls = 7;
  PendingChanges pending = 6;
}

message PlanRepositoryPushRequest {
  string repository_path = 1;
}

message PlanRepositoryPushResponse {
  oneof outcome {
    RepositoryPushTarget ready = 1;
    OperationDetail refused = 2;
  }
}

enum RepositoryPushMode {
  REPOSITORY_PUSH_MODE_UNSPECIFIED = 0;
  REPOSITORY_PUSH_MODE_EXISTING_COMMITS = 1;
  REPOSITORY_PUSH_MODE_COMMIT_CHANGES = 2;
}

message ExecuteRepositoryPushRequest {
  RepositoryPushTarget target = 1;
  RepositoryPushMode mode = 2;
  optional string message = 3;
}

enum RepositoryPushStatus {
  REPOSITORY_PUSH_STATUS_UNSPECIFIED = 0;
  REPOSITORY_PUSH_STATUS_NO_OP = 1;
  REPOSITORY_PUSH_STATUS_COMPLETED = 2;
  REPOSITORY_PUSH_STATUS_REFUSED = 3;
  REPOSITORY_PUSH_STATUS_FAILED = 4;
}

message RepositoryPushAttempt {
  optional string created_commit_id = 1;
}

message RepositoryMutationProgress {
  oneof state {
    Empty unchanged = 1;
    Empty staged = 2;
    string created_commit_id = 3;
    RepositoryPushAttempt push_attempted = 4;
  }
}

message ExecuteRepositoryPushResponse {
  RepositoryPushStatus status = 1;
  string detail = 2;
  RepositoryMutationProgress progress = 3;
}

message RepositoryCommitTarget {
  string project_name = 1;
  string repository_root = 2;
  string branch = 3;
  PendingChanges pending = 4;
}

message PlanRepositoryCommitRequest {
  string repository_path = 1;
}

message PlanRepositoryCommitResponse {
  oneof outcome {
    RepositoryCommitTarget ready = 1;
    OperationDetail refused = 2;
  }
}

message ExecuteRepositoryCommitRequest {
  RepositoryCommitTarget target = 1;
  string message = 2;
}

enum RepositoryCommitStatus {
  REPOSITORY_COMMIT_STATUS_UNSPECIFIED = 0;
  REPOSITORY_COMMIT_STATUS_COMMITTED = 1;
  REPOSITORY_COMMIT_STATUS_NO_OP = 2;
  REPOSITORY_COMMIT_STATUS_FAILED = 3;
}

message ExecuteRepositoryCommitResponse {
  RepositoryCommitStatus status = 1;
  string detail = 2;
  RepositoryMutationProgress progress = 3;
}

message PushDestination {
  string branch = 1;
  string remote = 2;
}

message RecursivePushTarget {
  string repository_root = 1;
  string label = 2;
  oneof destination {
    PushDestination push = 3;
    PushDestination synced = 4;
    OperationDetail skip = 5;
  }
}

message PlanRecursiveRepositoryPushRequest {
  string root = 1;
}

message RecursivePushPlan {
  repeated RecursivePushTarget targets = 1;
}

message PlanRecursiveRepositoryPushResponse {
  oneof outcome {
    RecursivePushPlan ready = 1;
    OperationDetail refused = 2;
  }
}

message ExecuteRecursiveRepositoryPushRequest {
  repeated RecursivePushTarget targets = 1;
}

enum RecursivePushStatus {
  RECURSIVE_PUSH_STATUS_UNSPECIFIED = 0;
  RECURSIVE_PUSH_STATUS_OK = 1;
  RECURSIVE_PUSH_STATUS_PARTIAL = 2;
  RECURSIVE_PUSH_STATUS_FAILED = 3;
}

enum RecursivePushRepositoryStatus {
  RECURSIVE_PUSH_REPOSITORY_STATUS_UNSPECIFIED = 0;
  RECURSIVE_PUSH_REPOSITORY_STATUS_PUSHED = 1;
  RECURSIVE_PUSH_REPOSITORY_STATUS_UP_TO_DATE = 2;
  RECURSIVE_PUSH_REPOSITORY_STATUS_SKIPPED = 3;
  RECURSIVE_PUSH_REPOSITORY_STATUS_FAILED = 4;
}

message RecursivePushRepositoryResult {
  string label = 1;
  RecursivePushRepositoryStatus status = 2;
  optional string detail = 3;
}

message ExecuteRecursiveRepositoryPushResponse {
  RecursivePushStatus status = 1;
  repeated RecursivePushRepositoryResult results = 2;
}

message GetRepositoryStatusRequest {
  string repository_path = 1;
}

message GetRecursiveRepositoryStatusesRequest {
  string root = 1;
}

message RepositoryAbsentStatus {}

message RepositoryPresentStatus {
  RepositoryStatusHead head = 1;
  RepositoryStatusChanges changes = 2;
}

message RepositoryStatusResult {
  string project_name = 1;
  oneof state {
    RepositoryAbsentStatus absent = 2;
    RepositoryPresentStatus present = 3;
  }
}

message RepositoryStatusHead {
  oneof state {
    RepositoryStatusUnavailable unavailable = 1;
    RepositoryStatusDetached detached = 2;
    RepositoryStatusBranch branch = 3;
  }
}

message RepositoryStatusUnavailable {}

message RepositoryStatusDetached {}

message RepositoryStatusBranch {
  string name = 1;
  oneof upstream {
    RepositoryUpstreamMissing missing = 2;
    RepositoryUpstreamTracking tracking = 3;
  }
}

message RepositoryUpstreamMissing {}

message RepositoryUpstreamTracking {
  string reference = 1;
  uint64 commits_ahead = 2;
}

message RepositoryStatusChanges {
  oneof state {
    RepositoryChangesClean clean = 1;
    RepositoryChangesChanged changed = 2;
    RepositoryChangesUnavailable unavailable = 3;
  }
}

message RepositoryChangesClean {}

message RepositoryChangesChanged {
  uint64 tracked_paths = 1;
  uint64 untracked_paths = 2;
}

message RepositoryChangesUnavailable {}

message GetRepositoryStatusResponse {
  repeated RepositoryStatusResult results = 1;
}

message GetRecursiveRepositoryStatusesResponse {
  repeated RepositoryStatusResult results = 1;
}

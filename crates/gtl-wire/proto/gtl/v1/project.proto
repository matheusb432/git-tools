syntax = "proto3";

package gtl.v1;

import "gtl/v1/repository_status.proto";
import "gtl/v1/repository_sync.proto";

service ProjectService {
  // Creates one active managed project and returns its ID.
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);

  // Gets a managed project, including a paused project.
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse);
  // Resolves the directory source of a managed project, including a paused project.
  rpc GetProjectRepository(GetProjectRepositoryRequest) returns (GetProjectRepositoryResponse);

  // Lists active projects in ascending project ID order.
  rpc ListActiveProjects(ListActiveProjectsRequest) returns (ListActiveProjectsResponse);

  // Pauses one managed project.
  rpc PauseProject(PauseProjectRequest) returns (PauseProjectResponse);

  // Resumes one managed project.
  rpc ResumeProject(ResumeProjectRequest) returns (ResumeProjectResponse);

  // Restores projects to the managed catalogue.
  rpc ManageProjects(ManageProjectsRequest) returns (ManageProjectsResponse);

  // Removes projects from the managed catalogue without changing their trees.
  rpc UnmanageProjects(UnmanageProjectsRequest) returns (UnmanageProjectsResponse);
  rpc PushProjectRepositories(PushProjectRepositoriesRequest) returns (PushProjectRepositoriesResponse);
  rpc PullProjectRepositories(PullProjectRepositoriesRequest) returns (PullProjectRepositoriesResponse);
  rpc GetProjectRepositoryStatuses(GetProjectRepositoryStatusesRequest) returns (GetProjectRepositoryStatusesResponse);
}

message PushProjectRepositoriesRequest {
  bool dry_run = 1;
}

message PullProjectRepositoriesRequest {
  bool dry_run = 1;
}

enum ProjectSyncExit {
  PROJECT_SYNC_EXIT_UNSPECIFIED = 0;
  PROJECT_SYNC_EXIT_CLEAN = 1;
  PROJECT_SYNC_EXIT_WARNING = 2;
  PROJECT_SYNC_EXIT_FAILED = 3;
}

message PushProjectRepositoriesResponse {
  repeated RepositorySyncResult selected = 1;
  ProjectSyncExit exit = 2;
  repeated string excluded_project_names = 3;
}

message PullProjectRepositoriesResponse {
  repeated RepositorySyncResult results = 1;
  ProjectSyncExit exit = 2;
}

message GetProjectRepositoryStatusesRequest {}

message GetProjectRepositoryStatusesResponse {
  repeated RepositoryStatusResult results = 1;
}

message CreateProjectRequest {
  // The caller-generated canonical 2 to 4 character uppercase project ID.
  string project_id = 1;
  ProjectCreation project = 2;
}

message CreateProjectResponse {
  string project_id = 1;
}

message ProjectCreation {
  reserved 4, 5;
  reserved "mux_session_name", "affiliation";

  string title = 1;
  ProjectSource source = 2;
  optional string git_remote = 3;
  optional string color = 6;
  repeated string groups = 7;
  // Defaults to true when omitted.
  optional bool include_in_full_export = 8;
}

message GetProjectRepositoryRequest {
  string project_id = 1;
}

message GetProjectRepositoryResponse {
  string repository_root = 1;
}

message GetProjectRequest {
  // The canonical 2 to 4 character uppercase project ID.
  string project_id = 1;
}

message GetProjectResponse {
  reserved 5, 7;
  reserved "mux_session_name", "affiliation";

  string id = 1;
  string title = 2;
  ProjectSource source = 3;
  optional string git_remote = 4;
  ProjectStatus status = 6;
  optional string color = 8;
  repeated string groups = 9;
}

message ListActiveProjectsRequest {}

message ListActiveProjectsResponse {
  repeated Project projects = 1;
}

enum ProjectOperationMode {
  PROJECT_OPERATION_MODE_UNSPECIFIED = 0;
  PROJECT_OPERATION_MODE_PREVIEW = 1;
  PROJECT_OPERATION_MODE_APPLY = 2;
}

enum ProjectMutationOutcome {
  PROJECT_MUTATION_OUTCOME_UNSPECIFIED = 0;
  PROJECT_MUTATION_OUTCOME_CHANGED = 1;
  PROJECT_MUTATION_OUTCOME_UNCHANGED = 2;
}

message PauseProjectRequest {
  string project_id = 1;
  ProjectOperationMode mode = 2;
}

message PauseProjectResponse {
  ProjectMutationOutcome outcome = 1;
  // The resulting status for apply, or the prospective status for preview.
  ProjectStatus target_status = 2;
}

message ResumeProjectRequest {
  string project_id = 1;
  ProjectOperationMode mode = 2;
}

message ResumeProjectResponse {
  ProjectMutationOutcome outcome = 1;
  // The resulting status for apply, or the prospective status for preview.
  ProjectStatus target_status = 2;
}

message ManageProjectsRequest {
  repeated string project_ids = 1;
  ProjectOperationMode mode = 2;
}

message ManageProjectsResponse {
  repeated ProjectMutation mutations = 1;
}

message UnmanageProjectsRequest {
  repeated string project_ids = 1;
  ProjectOperationMode mode = 2;
}

message UnmanageProjectsResponse {
  repeated ProjectMutation mutations = 1;
}

message ProjectMutation {
  string project_id = 1;
  ProjectMutationOutcome outcome = 2;
}

message Project {
  reserved 5, 7;
  reserved "mux_session_name", "affiliation";

  string id = 1;
  string title = 2;
  ProjectSource source = 3;
  optional string git_remote = 4;
  ProjectStatus status = 6;
  optional string color = 8;
  repeated string groups = 9;
}

message ProjectSource {
  oneof source {
    DirectorySource directory = 1;
  }
}

message DirectorySource {
  // Absolute native filesystem path. Repositories may be outside the user's home.
  string path = 1;
}

enum ProjectStatus {
  PROJECT_STATUS_UNSPECIFIED = 0;
  PROJECT_STATUS_ACTIVE = 1;
  PROJECT_STATUS_PAUSED = 2;
}

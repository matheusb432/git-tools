syntax = "proto3";

package gtl.v1;

import "gtl/v1/common.proto";
import "gtl/v1/diff_presentation.proto";

service DiffService {
  rpc PresentDiff(PresentDiffRequest) returns (PresentDiffResponse);
  rpc PresentMergeDiff(PresentMergeDiffRequest) returns (PresentMergeDiffResponse);
  rpc PresentSubrepositoryDiffs(PresentSubrepositoryDiffsRequest) returns (PresentSubrepositoryDiffsResponse);
  rpc PresentProjectRepositoryDiffs(PresentProjectRepositoryDiffsRequest) returns (PresentProjectRepositoryDiffsResponse);
  rpc RenderDiff(RenderDiffRequest) returns (RenderDiffResponse);
  rpc RenderMergeDiff(RenderMergeDiffRequest) returns (RenderMergeDiffResponse);
  rpc RenderSubrepositoryDiffs(RenderSubrepositoryDiffsRequest) returns (RenderSubrepositoryDiffsResponse);
  rpc RenderProjectRepositoryDiffs(RenderProjectRepositoryDiffsRequest) returns (RenderProjectRepositoryDiffsResponse);
}

message DiffTarget {
  oneof selection {
    Empty unpushed = 1;
    string base_revision = 2;
    string revision_range = 3;
    string merge_base = 4;
    uint32 last_commit_count = 5;
    string commit_revision = 6;
  }
}

message RenderDiffRequest {
  string working_directory = 1;
  DiffTarget target = 2;
  optional string name = 3;
}

message RenderMergeDiffRequest {
  string working_directory = 1;
  optional string base_revision = 2;
}

message PresentDiffRequest {
  string working_directory = 1;
  DiffTarget target = 2;
  optional string name = 3;
}

message PresentMergeDiffRequest {
  string working_directory = 1;
  optional string base_revision = 2;
}

message PresentSubrepositoryDiffsRequest {
  string root = 1;
  DiffTarget target = 2;
  bool include_linked_worktrees = 3;
}

message PresentProjectRepositoryDiffsRequest {
  string root = 1;
}

message PresentDiffResponse {
  DiffPresentation presentation = 1;
}

message PresentMergeDiffResponse {
  DiffPresentation presentation = 1;
}

message PresentSubrepositoryDiffsResponse {
  DiffPresentation presentation = 1;
}

message PresentProjectRepositoryDiffsResponse {
  DiffPresentation presentation = 1;
}

message RenderSubrepositoryDiffsRequest {
  string root = 1;
  DiffTarget target = 2;
  bool include_linked_worktrees = 3;
}

message RenderProjectRepositoryDiffsRequest {
  string root = 1;
}

message RenderDiffResponse {
  repeated Note notes = 1;

  oneof outcome {
    Artifact rendered = 2;
    Empty empty = 3;
  }
}

message RenderMergeDiffResponse {
  repeated Note notes = 1;

  oneof outcome {
    Artifact rendered = 2;
    Empty empty = 3;
  }
}

message RenderSubrepositoryDiffsResponse {
  repeated Note notes = 1;

  oneof outcome {
    Artifact rendered = 2;
    Empty empty = 3;
  }
}

message RenderProjectRepositoryDiffsResponse {
  repeated Note notes = 1;

  oneof outcome {
    Artifact rendered = 2;
    Empty empty = 3;
  }
}

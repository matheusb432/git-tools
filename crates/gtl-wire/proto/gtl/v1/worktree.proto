syntax = "proto3";

package gtl.v1;

import "gtl/v1/common.proto";

service WorktreeService {
  rpc GetWorktreeBase(GetWorktreeBaseRequest) returns (GetWorktreeBaseResponse);
  rpc ListWorktrees(ListWorktreesRequest) returns (ListWorktreesResponse);
}

message GetWorktreeBaseRequest {
  string repository_path = 1;
}

message WorktreePath {
  string path = 1;
}

message WorktreeFailure {
  string detail = 1;
}

message GetWorktreeBaseResponse {
  oneof outcome {
    WorktreePath found = 1;
    WorktreeFailure failed = 2;
  }
}

message ListWorktreesRequest {
  string repository_path = 1;
}

message Worktree {
  string path = 1;
  string commit_id = 2;
  oneof kind {
    string branch = 3;
    Empty detached = 4;
    Empty bare = 5;
  }
  optional string locked = 6;
  optional string prunable = 7;
}

message WorktreeList {
  repeated Worktree worktrees = 1;
}

message ListWorktreesResponse {
  oneof outcome {
    WorktreeList listed = 1;
    WorktreeFailure failed = 2;
  }
}

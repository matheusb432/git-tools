syntax = "proto3";

package gtl.v1;

service SettingsService {
  rpc GetPushConfirmationRequirement(GetPushConfirmationRequirementRequest) returns (GetPushConfirmationRequirementResponse);
  rpc SetViewerTheme(SetViewerThemeRequest) returns (SetViewerThemeResponse);
}

message GetPushConfirmationRequirementRequest {}

enum ViewerTheme {
  VIEWER_THEME_UNSPECIFIED = 0;
  VIEWER_THEME_LIGHT = 1;
  VIEWER_THEME_DARK = 2;
  VIEWER_THEME_HEARTH = 3;
  VIEWER_THEME_MIRAGE = 4;
  VIEWER_THEME_GLACIER = 5;
  VIEWER_THEME_NOIR = 6;
  VIEWER_THEME_GRAPHITE = 7;
}

message GetPushConfirmationRequirementResponse {
  bool push_confirmation_required = 1;
}

message SetViewerThemeRequest {
  ViewerTheme theme = 1;
}

message SetViewerThemeResponse {
  ViewerTheme theme = 1;
  string configuration_path = 2;
}

syntax = "proto3";

package gtl.v1;

import "gtl/v1/common.proto";
import "gtl/v1/repository.proto";
import "gtl/v1/settings.proto";

service ViewerService {
  rpc SetViewerTabPinned(SetViewerTabPinnedRequest) returns (SetViewerTabPinnedResponse);
  rpc CloseOtherViewerTabs(CloseOtherViewerTabsRequest) returns (CloseOtherViewerTabsResponse);
  rpc SetViewerModifiedFiles(SetViewerModifiedFilesRequest) returns (SetViewerModifiedFilesResponse);
  rpc ListViewerProjects(ListViewerProjectsRequest) returns (ListViewerProjectsResponse);
  rpc OpenViewerProject(OpenViewerProjectRequest) returns (OpenViewerProjectResponse);
  rpc UpdateViewerProject(UpdateViewerProjectRequest) returns (UpdateViewerProjectResponse);
  rpc GetViewerShell(GetViewerShellRequest) returns (GetViewerShellResponse);
  rpc WatchViewer(WatchViewerRequest) returns (stream WatchViewerResponse);
  rpc StreamViewerRowSession(stream StreamViewerRowSessionRequest) returns (stream StreamViewerRowSessionResponse);
  rpc StreamViewerRows(StreamViewerRowsRequest) returns (stream StreamViewerRowsResponse);
  rpc SearchViewerFiles(SearchViewerFilesRequest) returns (SearchViewerFilesResponse);
  rpc FindViewerDiff(FindViewerDiffRequest) returns (FindViewerDiffResponse);
  rpc ReadViewerDiffText(ReadViewerDiffTextRequest) returns (ReadViewerDiffTextResponse);
  rpc ActivateViewerTab(ActivateViewerTabRequest) returns (ActivateViewerTabResponse);
  rpc MoveViewerTab(MoveViewerTabRequest) returns (MoveViewerTabResponse);
  rpc CloseViewerTab(CloseViewerTabRequest) returns (CloseViewerTabResponse);
  rpc RefreshViewerTab(RefreshViewerTabRequest) returns (RefreshViewerTabResponse);
  rpc DeleteLiveViewerTab(DeleteLiveViewerTabRequest) returns (DeleteLiveViewerTabResponse);
  rpc SelectViewerCommit(SelectViewerCommitRequest) returns (SelectViewerCommitResponse);
  rpc ClearViewerCommitSelection(ClearViewerCommitSelectionRequest) returns (ClearViewerCommitSelectionResponse);
  rpc SetViewerPreference(SetViewerPreferenceRequest) returns (SetViewerPreferenceResponse);
  rpc ListViewerCommits(ListViewerCommitsRequest) returns (ListViewerCommitsResponse);
  rpc ListViewerHistory(ListViewerHistoryRequest) returns (ListViewerHistoryResponse);
  rpc OpenViewerHistory(OpenViewerHistoryRequest) returns (OpenViewerHistoryResponse);
  rpc GetViewerHistoryCopy(GetViewerHistoryCopyRequest) returns (GetViewerHistoryCopyResponse);
  rpc GetViewerSettings(GetViewerSettingsRequest) returns (GetViewerSettingsResponse);
  rpc GetSettingsRecovery(GetSettingsRecoveryRequest) returns (GetSettingsRecoveryResponse);
  rpc ResetSettings(ResetSettingsRequest) returns (ResetSettingsResponse);
  rpc EditSettings(EditSettingsRequest) returns (EditSettingsResponse);
  rpc OpenViewerDiffFile(OpenViewerDiffFileRequest) returns (OpenViewerDiffFileResponse);
}

message GetViewerShellRequest {}

message ReadViewerDiffTextRequest {
  ViewerViewIdentity identity = 1;
  string file_id = 2;
  ViewerRowRange row_range = 3;
  bool old_side = 4;
}

message ViewerDiffTextLine {
  uint32 line_number = 1;
  string text = 2;
}

message ReadViewerDiffTextResponse {
  repeated ViewerDiffTextLine lines = 1;
}

message WatchViewerRequest {
  optional uint64 live_tab_id = 1;
}

message WatchViewerResponse {
  uint64 version = 1;
  optional ViewerLiveCheck live_check = 2;
}

message ViewerLiveCheck {
  uint64 tab_id = 1;
  optional string error = 2;
  uint64 elapsed_ms = 3;
}

enum ViewerDiffLayout {
  VIEWER_DIFF_LAYOUT_UNSPECIFIED = 0;
  VIEWER_DIFF_LAYOUT_UNIFIED = 1;
  VIEWER_DIFF_LAYOUT_SPLIT = 2;
}

enum ViewerDiffDensity {
  VIEWER_DIFF_DENSITY_UNSPECIFIED = 0;
  VIEWER_DIFF_DENSITY_COMPACT = 1;
  VIEWER_DIFF_DENSITY_FULL = 2;
}

message ViewerRenderOptions {
  bool wrap_lines = 3;
  ViewerDiffLayout layout = 1;
  ViewerDiffDensity density = 2;
}

message ViewerViewIdentity {
  uint64 tab_id = 1;
  uint64 range_generation = 2;
  uint64 selection_generation = 3;
  ViewerRenderOptions render_options = 4;
}

enum ViewerTabKind {
  VIEWER_TAB_KIND_UNSPECIFIED = 0;
  VIEWER_TAB_KIND_SNAPSHOT = 1;
  VIEWER_TAB_KIND_LIVE = 2;
  VIEWER_TAB_KIND_LIVE_LOCAL_CHANGES = 3;
  VIEWER_TAB_KIND_LIVE_UNPUSHED_COMMITS = 4;
  VIEWER_TAB_KIND_LIVE_BRANCH_CHANGES = 5;
}

enum ViewerTabState {
  VIEWER_TAB_STATE_UNSPECIFIED = 0;
  VIEWER_TAB_STATE_PENDING = 1;
  VIEWER_TAB_STATE_READY = 2;
  VIEWER_TAB_STATE_BROKEN = 3;
  VIEWER_TAB_STATE_ERROR = 4;
}

message ViewerTab {
  uint64 id = 1;
  string label = 2;
  ViewerTabKind kind = 3;
  ViewerTabState state = 4;
  bool pinned = 5;
}

enum ViewerFileStatus {
  VIEWER_FILE_STATUS_UNSPECIFIED = 0;
  VIEWER_FILE_STATUS_ADDED = 1;
  VIEWER_FILE_STATUS_DELETED = 2;
  VIEWER_FILE_STATUS_RENAMED = 3;
  VIEWER_FILE_STATUS_MODIFIED = 4;
}

message ViewerFileSummary {
  string id = 1;
  string path = 2;
  string absolute_path = 3;
  string anchor_id = 4;
  uint32 added = 5;
  uint32 removed = 6;
  ViewerFileStatus status = 7;
  bool can_open_in_editor = 8;
  bool initially_expanded = 9;
  uint32 row_count = 10;
}

message ViewerCommandLine {
  string lead = 1;
  string range = 2;
  string trail = 3;
}

message ViewerFooter {
  string command = 1;
}

message ViewerAppliedExclusions {
  repeated string extensions = 1;
  repeated string hidden_paths = 2;
}

enum ViewerFailureCode {
  VIEWER_FAILURE_CODE_UNSPECIFIED = 0;
  VIEWER_FAILURE_CODE_REPOSITORY_DIRECTORY_NOT_FOUND = 1;
  VIEWER_FAILURE_CODE_REPOSITORY_DIRECTORY_NOT_GIT_REPOSITORY = 2;
  VIEWER_FAILURE_CODE_SOURCE_UNAVAILABLE = 3;
  VIEWER_FAILURE_CODE_RENDER_FAILED = 4;
}

enum ViewerCommitSelectionState {
  VIEWER_COMMIT_SELECTION_STATE_UNSPECIFIED = 0;
  VIEWER_COMMIT_SELECTION_STATE_NONE = 1;
  VIEWER_COMMIT_SELECTION_STATE_PENDING = 2;
  VIEWER_COMMIT_SELECTION_STATE_READY = 3;
  VIEWER_COMMIT_SELECTION_STATE_ERROR = 4;
}

message ViewerCommitSelection {
  ViewerCommitSelectionState state = 1;
  optional string commit_id = 2;
  optional string message = 3;
}

enum ViewerRowSourceState {
  VIEWER_ROW_SOURCE_STATE_UNSPECIFIED = 0;
  VIEWER_ROW_SOURCE_STATE_READY = 1;
  VIEWER_ROW_SOURCE_STATE_PENDING = 2;
  VIEWER_ROW_SOURCE_STATE_FAILED = 3;
}

message ViewerActiveView {
  ViewerViewIdentity identity = 1;
  string title = 2;
  string repository_name = 3;
  string branch = 4;
  string upstream = 5;
  ViewerCommandLine command = 6;
  repeated ViewerFileSummary files = 7;
  string commits_label = 8;
  uint32 commit_count = 9;
  ViewerCommitSelection commit_selection = 10;
  ViewerFooter footer = 11;
  optional ViewerAppliedExclusions exclusions = 12;
  optional bytes content_id = 13;
  ViewerRowSourceState row_source = 14;
  bool modified_files = 15;
}

message ViewerPendingState {
  uint64 tab_id = 1;
}

message ViewerFailureState {
  uint64 tab_id = 1;
  ViewerFailureCode code = 2;
  string message = 3;
}

message ViewerReadyState {
  ViewerActiveView view = 1;
}

message ViewerActiveState {
  oneof state {
    Empty empty = 1;
    ViewerPendingState pending = 2;
    ViewerFailureState broken = 3;
    ViewerFailureState error = 4;
    ViewerReadyState ready = 5;
  }
}

message ViewerSidebarVisibility {
  bool files = 1;
  bool commits = 2;
}

message ViewerPreferences {
  ViewerSidebarVisibility sidebars = 4;
  ViewerTheme theme = 1;
  ViewerRenderOptions render_options = 2;
  ViewerKeybindings keybindings = 3;
}

enum ViewerKeybindingPlatform {
  VIEWER_KEYBINDING_PLATFORM_UNSPECIFIED = 0;
  VIEWER_KEYBINDING_PLATFORM_LINUX = 1;
  VIEWER_KEYBINDING_PLATFORM_WINDOWS = 2;
  VIEWER_KEYBINDING_PLATFORM_MAC_OS = 3;
  VIEWER_KEYBINDING_PLATFORM_OTHER = 4;
}

message ViewerKeybindings {
  string toggle_files_sidebar = 4;
  string toggle_commits_sidebar = 5;
  ViewerKeybindingPlatform platform = 1;
  string search_files = 2;
  string search_text_in_all_files = 3;
}

enum ViewerFeedbackKind {
  VIEWER_FEEDBACK_KIND_UNSPECIFIED = 0;
  VIEWER_FEEDBACK_KIND_TAB_CLOSED = 1;
  VIEWER_FEEDBACK_KIND_LIVE_VIEW_DELETED = 2;
  VIEWER_FEEDBACK_KIND_SNAPSHOT_RECIPES_SKIPPED = 3;
}

message ViewerFeedback {
  ViewerFeedbackKind kind = 1;
  repeated string labels = 2;
}

message ViewerShell {
  uint64 version = 1;
  repeated ViewerTab tabs = 2;
  ViewerActiveState active = 3;
  ViewerPreferences preferences = 4;
  optional ViewerFeedback feedback = 5;
  optional uint64 focus_request_version = 6;
}

message GetViewerShellResponse {
  ViewerShell shell = 1;
}

message ActivateViewerTabRequest {
  uint64 tab_id = 1;
}

message ActivateViewerTabResponse {
  ViewerShell shell = 1;
}

enum ViewerTabPlacement {
  VIEWER_TAB_PLACEMENT_UNSPECIFIED = 0;
  VIEWER_TAB_PLACEMENT_BEFORE = 1;
  VIEWER_TAB_PLACEMENT_AFTER = 2;
}

message MoveViewerTabRequest {
  uint64 tab_id = 1;
  uint64 target_tab_id = 2;
  ViewerTabPlacement placement = 3;
}

message MoveViewerTabResponse {
  ViewerShell shell = 1;
}

message CloseViewerTabRequest {
  uint64 tab_id = 1;
}

message CloseViewerTabResponse {
  ViewerShell shell = 1;
}

message RefreshViewerTabRequest {
  uint64 tab_id = 1;
}

message RefreshViewerTabResponse {
  ViewerShell shell = 1;
}

message DeleteLiveViewerTabRequest {
  uint64 tab_id = 1;
}

message DeleteLiveViewerTabResponse {
  ViewerShell shell = 1;
}

message SelectViewerCommitRequest {
  uint64 tab_id = 1;
  string commit_id = 2;
}

message SelectViewerCommitResponse {
  ViewerShell shell = 1;
}

message ClearViewerCommitSelectionRequest {
  uint64 tab_id = 1;
}

message ClearViewerCommitSelectionResponse {
  ViewerShell shell = 1;
}

message SetViewerPreferenceRequest {
  oneof preference {
    ViewerDiffLayout layout = 1;
    ViewerDiffDensity density = 2;
    ViewerTheme theme = 3;
  }
}

message SetViewerPreferenceResponse {
  ViewerShell shell = 1;
}

message ListViewerCommitsRequest {
  ViewerViewIdentity identity = 1;
  optional uint32 cursor = 2;
}

message ViewerCommitSummary {
  string id = 1;
  string subject = 2;
  string body = 3;
  string committed_at = 4;
  bool is_merge = 5;
  bool body_omitted = 6;
}

message ListViewerCommitsResponse {
  ViewerViewIdentity identity = 1;
  repeated ViewerCommitSummary commits = 2;
  optional uint32 next_cursor = 3;
}

message ViewerRowRange {
  uint32 start = 1;
  uint32 count = 2;
}

message StreamViewerRowsRequest {
  ViewerViewIdentity identity = 1;
  optional string file_id = 2;
  ViewerRowRange row_range = 3;
}

message StreamViewerRowSessionRequest {
  uint64 request_id = 1;
  StreamViewerRowsRequest rows = 2;
}

message StreamViewerRowSessionResponse {
  uint64 request_id = 1;
  oneof event {
    StreamViewerRowsResponse rows = 2;
    Empty completed = 3;
    ViewerRowSessionFailure failed = 4;
  }
}

message ViewerRowSessionFailure {
  ViewerRowSessionFailureCode code = 1;
}

enum ViewerRowSessionFailureCode {
  VIEWER_ROW_SESSION_FAILURE_CODE_UNSPECIFIED = 0;
  VIEWER_ROW_SESSION_FAILURE_CODE_INVALID_REQUEST = 1;
  VIEWER_ROW_SESSION_FAILURE_CODE_NOT_FOUND = 2;
  VIEWER_ROW_SESSION_FAILURE_CODE_CONFLICT = 3;
  VIEWER_ROW_SESSION_FAILURE_CODE_RESOURCE_EXHAUSTED = 4;
  VIEWER_ROW_SESSION_FAILURE_CODE_UNAVAILABLE = 5;
  VIEWER_ROW_SESSION_FAILURE_CODE_INVALID_SETTINGS = 6;
  VIEWER_ROW_SESSION_FAILURE_CODE_INTERNAL = 7;
}

message SearchViewerFilesRequest {
  ViewerViewIdentity identity = 1;
  string query = 2;
}

message SearchViewerFilesResponse {
  ViewerViewIdentity identity = 1;
  repeated string file_ids = 2;
}

enum ViewerDiffSearchDirection {
  VIEWER_DIFF_SEARCH_DIRECTION_UNSPECIFIED = 0;
  VIEWER_DIFF_SEARCH_DIRECTION_FORWARD = 1;
  VIEWER_DIFF_SEARCH_DIRECTION_BACKWARD = 2;
}

message ViewerDiffSearchMatch {
  string file_id = 1;
  uint32 row_index = 2;
}

message FindViewerDiffRequest {
  ViewerViewIdentity identity = 1;
  string query = 2;
  ViewerDiffSearchDirection direction = 3;
  optional ViewerDiffSearchMatch anchor = 4;
}

message FindViewerDiffResponse {
  ViewerViewIdentity identity = 1;
  uint64 total_matches = 2;
  optional ViewerDiffSearchMatch active_match = 3;
  bool wrapped = 4;
}

enum ViewerSyntaxClass {
  VIEWER_SYNTAX_CLASS_UNSPECIFIED = 0;
  VIEWER_SYNTAX_CLASS_KEYWORD = 1;
  VIEWER_SYNTAX_CLASS_STRING = 2;
  VIEWER_SYNTAX_CLASS_COMMENT = 3;
  VIEWER_SYNTAX_CLASS_TYPE = 4;
  VIEWER_SYNTAX_CLASS_FUNCTION = 5;
  VIEWER_SYNTAX_CLASS_NUMBER = 6;
  VIEWER_SYNTAX_CLASS_CONSTANT = 7;
  VIEWER_SYNTAX_CLASS_OPERATOR = 8;
  VIEWER_SYNTAX_CLASS_TAG = 9;
  VIEWER_SYNTAX_CLASS_VARIABLE = 10;
}

message ViewerCodeSpan {
  uint32 byte_start = 1;
  uint32 byte_end = 2;
  ViewerSyntaxClass syntax_class = 3;
  bool changed = 4;
}

message ViewerCodeLine {
  string text = 1;
  repeated ViewerCodeSpan spans = 2;
  optional uint32 long_line_character_count = 3;
}

message ViewerUnifiedSourceRow {
  optional uint32 old_line_number = 1;
  optional uint32 new_line_number = 2;
  ViewerCodeLine code = 3;
}

message ViewerUnifiedRow {
  oneof row {
    string meta = 1;
    string hunk = 2;
    ViewerUnifiedSourceRow context = 3;
    ViewerUnifiedSourceRow added = 4;
    ViewerUnifiedSourceRow removed = 5;
  }
}

message ViewerSplitCell {
  uint32 line_number = 1;
  ViewerCodeLine code = 2;
}

message ViewerSplitContextRow {
  uint32 old_line_number = 1;
  uint32 new_line_number = 2;
  ViewerCodeLine code = 3;
}

message ViewerSplitPairRow {
  optional ViewerSplitCell old = 1;
  optional ViewerSplitCell new = 2;
}

message ViewerSplitRow {
  oneof row {
    string meta = 1;
    string hunk = 2;
    ViewerSplitContextRow context = 3;
    ViewerSplitPairRow pair = 4;
  }
}

message ViewerFileStarted {
  string file_id = 1;
  uint32 row_count = 2;
  uint32 start_row = 3;
}

message ViewerUnifiedRows {
  string file_id = 1;
  repeated ViewerUnifiedRow rows = 2;
  uint32 start_row = 3;
}

message ViewerSplitRows {
  string file_id = 1;
  repeated ViewerSplitRow rows = 2;
  uint32 start_row = 3;
}

message ViewerFileFinished {
  string file_id = 1;
  uint32 line_number_digits = 2;
  uint32 end_row = 3;
}

enum ViewerFileFailureCode {
  VIEWER_FILE_FAILURE_CODE_UNSPECIFIED = 0;
  VIEWER_FILE_FAILURE_CODE_SOURCE_UNAVAILABLE = 1;
  VIEWER_FILE_FAILURE_CODE_PARSE_FAILED = 2;
  VIEWER_FILE_FAILURE_CODE_ROW_TOO_LARGE = 3;
}

message ViewerFileFailed {
  string file_id = 1;
  ViewerFileFailureCode code = 2;
  string message = 3;
  bool retryable = 4;
}

message StreamViewerRowsResponse {
  ViewerViewIdentity identity = 1;
  uint64 sequence = 2;

  oneof event {
    ViewerFileStarted file_started = 3;
    ViewerUnifiedRows unified_rows = 4;
    ViewerSplitRows split_rows = 5;
    ViewerFileFinished file_finished = 6;
    ViewerFileFailed file_failed = 7;
  }
}

message ListViewerHistoryRequest {
  oneof filter {
    Empty all_projects = 5;
    Empty unassociated = 6;
    string project_name = 7;
  }
  oneof cursor {
    Empty newest = 1;
    ViewerHistoryPosition older_than = 2;
    ViewerHistoryPosition newer_than = 3;
    Empty oldest = 4;
  }
}

message ViewerHistoryPosition {
  uint64 render_id = 1;
  uint32 page = 2;
}

enum ViewerRecipeKind {
  VIEWER_RECIPE_KIND_UNSPECIFIED = 0;
  VIEWER_RECIPE_KIND_DIFF = 1;
  VIEWER_RECIPE_KIND_MERGE_DIFF = 2;
}

message ViewerHistoryEntry {
  uint64 id = 1;
  string title = 2;
  string repository_name = 3;
  ViewerRecipeKind kind = 4;
  string range_label = 5;
  string rendered_at = 6;
}

message ViewerHistoryPagePosition {
  uint32 number = 1;
  uint32 count = 2;
}

message ListViewerHistoryResponse {
  repeated string projects = 6;
  repeated ViewerHistoryEntry entries = 1;
  uint64 total_count = 2;
  optional ViewerHistoryPagePosition position = 3;
  bool has_newer = 4;
  bool has_older = 5;
}

message OpenViewerHistoryRequest {
  uint64 render_id = 1;
}

message OpenViewerHistoryResponse {
  ViewerShell shell = 1;
}

message GetViewerHistoryCopyRequest {
  uint64 render_id = 1;
}

message GetViewerHistoryCopyResponse {
  string json = 1;
}

message GetViewerSettingsRequest {}

message ViewerProjectDiffExclusions {
  string project_name = 1;
  repeated string extensions = 2;
  bool excluded_from_push_all = 3;
}

message ViewerDiffExclusions {
  repeated string default_extensions = 1;
  repeated ViewerProjectDiffExclusions projects = 2;
}

enum ProjectsViewMode {
  PROJECTS_VIEW_MODE_UNSPECIFIED = 0;
  PROJECTS_VIEW_MODE_GRID = 1;
  PROJECTS_VIEW_MODE_TABLE = 2;
}
message ProjectsViewFieldUpdate {
  oneof operation {
    ProjectsViewMode update = 1;
    ClearSetting clear = 2;
  }
}

message GetViewerSettingsResponse {
  ViewerSidebarVisibility sidebars = 9;
  ProjectsViewMode projects_view = 7;
  optional string configuration_path = 1;
  optional ViewerTheme configured_theme = 2;
  ViewerTheme effective_theme = 3;
  ViewerRenderOptions render_options = 4;
  bool push_confirmation_required = 5;
  ViewerDiffExclusions diff_exclusions = 6;
}

message ClearSetting {}

message ThemeFieldUpdate {
  oneof operation {
    ViewerTheme update = 1;
    ClearSetting clear = 2;
  }
}
message LayoutFieldUpdate {
  oneof operation {
    ViewerDiffLayout update = 1;
    ClearSetting clear = 2;
  }
}
message DensityFieldUpdate {
  oneof operation {
    ViewerDiffDensity update = 1;
    ClearSetting clear = 2;
  }
}
message BoolFieldUpdate {
  oneof operation {
    bool update = 1;
    ClearSetting clear = 2;
  }
}
message ExtensionsValue {
  repeated string extensions = 1;
}
message ExtensionsFieldUpdate {
  oneof operation {
    ExtensionsValue update = 1;
    ClearSetting clear = 2;
  }
}
message ViewerProjectSettingsUpdate {
  string project_name = 1;
  bool excluded_from_push_all = 2;
  repeated string diff_exclusions = 3;
}
message ProjectSettingsValue {
  repeated ViewerProjectSettingsUpdate projects = 1;
}
message ProjectSettingsFieldUpdate {
  oneof operation {
    ProjectSettingsValue update = 1;
    ClearSetting clear = 2;
  }
}

message EditSettingsRequest {
  BoolFieldUpdate files_sidebar_visible = 9;
  BoolFieldUpdate commits_sidebar_visible = 10;
  BoolFieldUpdate wrap_lines = 8;
  ProjectsViewFieldUpdate projects_view = 7;
  ThemeFieldUpdate theme = 1;
  LayoutFieldUpdate layout = 2;
  DensityFieldUpdate density = 3;
  BoolFieldUpdate push_confirmation_required = 4;
  ExtensionsFieldUpdate default_diff_exclusions = 5;
  ProjectSettingsFieldUpdate projects = 6;
}

message EditSettingsResponse {}

message OpenViewerDiffFileRequest {
  ViewerViewIdentity identity = 1;
  string file_id = 2;
}

message OpenViewerDiffFileResponse {}

message ListViewerProjectsRequest {}
message ListViewerProjectsResponse {
  repeated ViewerProject projects = 1;
}
message ViewerProject {
  string path = 1;
  RepositoryStatusResult status = 2;
  optional string last_rendered_at = 3;
  string comparison_branch = 4;
  ViewerProjectBranchComparison branch_comparison = 5;
}
message ViewerProjectBranchComparison {
  oneof state {
    Empty upstream = 1;
    uint64 commits_ahead = 2;
    string unavailable_reason = 3;
  }
}
message ComparisonBranchFieldUpdate {
  oneof operation {
    string update = 1;
    ClearSetting clear = 2;
  }
}
message UpdateViewerProjectRequest {
  string path = 1;
  ComparisonBranchFieldUpdate comparison_branch = 2;
  string expected_comparison_branch = 3;
}
message UpdateViewerProjectResponse {}
enum ViewerProjectDiffMode {
  VIEWER_PROJECT_DIFF_MODE_UNSPECIFIED = 0;
  VIEWER_PROJECT_DIFF_MODE_SNAPSHOT = 1;
  VIEWER_PROJECT_DIFF_MODE_LIVE = 2;
}
message OpenViewerProjectRequest {
  reserved 2;
  reserved "comparison";
  string path = 1;
  ViewerProjectDiffMode mode = 3;
}
message OpenViewerProjectResponse {
  uint64 tab_id = 1;
}

message GetSettingsRecoveryRequest {}

message GetSettingsRecoveryResponse {
  string configuration_path = 1;
  optional string diagnostic = 2;
  string revision = 3;
}

message ResetSettingsRequest {
  string revision = 1;
}

message ResetSettingsResponse {
  string backup_path = 1;
}

message SetViewerModifiedFilesRequest {
  uint64 tab_id = 1;
  bool visible = 2;
}
message SetViewerModifiedFilesResponse {}

message SetViewerTabPinnedRequest {
  uint64 tab_id = 1;
  bool pinned = 2;
}
message SetViewerTabPinnedResponse {}
message CloseOtherViewerTabsRequest {
  uint64 tab_id = 1;
}
message CloseOtherViewerTabsResponse {}

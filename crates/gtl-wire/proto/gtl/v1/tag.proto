syntax = "proto3";

package gtl.v1;

import "gtl/v1/common.proto";

service TagService {
  rpc PlanTagBump(PlanTagBumpRequest) returns (PlanTagBumpResponse);
  rpc ExecuteTagBump(ExecuteTagBumpRequest) returns (ExecuteTagBumpResponse);
  rpc ListTags(ListTagsRequest) returns (ListTagsResponse);
  rpc AddTag(AddTagRequest) returns (AddTagResponse);
  rpc PushTags(PushTagsRequest) returns (PushTagsResponse);
  rpc AddAndPushTag(AddAndPushTagRequest) returns (AddAndPushTagResponse);
  rpc LabelTag(LabelTagRequest) returns (LabelTagResponse);
}

enum SemverComponent {
  SEMVER_COMPONENT_UNSPECIFIED = 0;
  SEMVER_COMPONENT_MAJOR = 1;
  SEMVER_COMPONENT_MINOR = 2;
  SEMVER_COMPONENT_PATCH = 3;
}

message TagBumpLevel {
  oneof kind {
    uint32 slot_from_right = 1;
    SemverComponent component = 2;
  }
}

message PlanTagBumpRequest {
  string repository_path = 1;
  TagBumpLevel level = 2;
  string message = 3;
  bool push = 4;
  optional string pattern = 5;
}

message GitHead {
  oneof state {
    string branch = 1;
    Empty detached = 2;
  }
}

message TagBumpPreview {
  string repository_root = 1;
  GitHead head = 2;
  string target_commit_id = 3;
  string pattern = 4;
  string template = 5;
  uint32 slot_from_right = 6;
  optional string base_tag = 7;
  string next_tag = 8;
  string message = 9;
  bool push = 10;
  repeated string push_urls = 11;
}

message TagBumpRejection {
  string detail = 1;
}

message PlanTagBumpResponse {
  oneof outcome {
    TagBumpPreview ready = 1;
    TagBumpRejection rejected = 2;
  }
}

message ExecuteTagBumpRequest {
  TagBumpPreview preview = 1;
}

enum TagBumpStatus {
  TAG_BUMP_STATUS_UNSPECIFIED = 0;
  TAG_BUMP_STATUS_CREATED = 1;
  TAG_BUMP_STATUS_NO_OP = 2;
  TAG_BUMP_STATUS_PUSHED = 3;
  TAG_BUMP_STATUS_FAILED = 4;
}

message TagBumpResult {
  string tag = 1;
  TagBumpStatus status = 2;
  string detail = 3;
  TagOperationProgress progress = 4;
}

message ExecuteTagBumpResponse {
  repeated Note notes = 1;

  oneof outcome {
    TagBumpResult applied = 2;
    TagBumpRejection rejected = 3;
  }
}

message ListTagsRequest {
  string repository_path = 1;
  bool include_state = 2;
}

enum TagState {
  TAG_STATE_UNSPECIFIED = 0;
  TAG_STATE_NOT_QUERIED = 1;
  TAG_STATE_LOCAL = 2;
  TAG_STATE_REMOTE = 3;
}

message Tag {
  string name = 1;
  string object_id = 2;
  string commit_id = 3;
  optional string created_at = 4;
  bool annotated = 5;
  optional string message = 6;
  TagState state = 7;
}

message CanonicalTagGroup {
  Tag canonical = 1;
  repeated Tag labels = 2;
}

message TagCollection {
  repeated Tag tags = 1;
}

message TagGroup {
  oneof kind {
    Tag single = 1;
    CanonicalTagGroup canonical = 2;
    TagCollection multiple_annotated = 3;
    TagCollection all_labels = 4;
  }
}

message TagGroups {
  repeated TagGroup groups = 1;
}

message TagListFailure {
  string detail = 1;
}

message ListTagsResponse {
  oneof outcome {
    TagGroups listed = 1;
    TagListFailure failed = 2;
  }
}

message AddTagRequest {
  string repository_path = 1;
  string tag = 2;
  string message = 3;
}

message PushTagsRequest {
  string repository_path = 1;
}

message AddAndPushTagRequest {
  string repository_path = 1;
  string tag = 2;
  string message = 3;
  optional string label = 4;
}

message LabelTagRequest {
  string repository_path = 1;
  string tag = 2;
  string label = 3;
}

enum TagActionStatus {
  TAG_ACTION_STATUS_UNSPECIFIED = 0;
  TAG_ACTION_STATUS_CREATED = 1;
  TAG_ACTION_STATUS_NO_OP = 2;
  TAG_ACTION_STATUS_PUSHED = 3;
  TAG_ACTION_STATUS_FAILED = 4;
  TAG_ACTION_STATUS_ABORTED = 5;
}

enum TagRemotePushProgress {
  TAG_REMOTE_PUSH_PROGRESS_UNSPECIFIED = 0;
  TAG_REMOTE_PUSH_PROGRESS_NOT_STARTED = 1;
  TAG_REMOTE_PUSH_PROGRESS_COMPLETED = 2;
  TAG_REMOTE_PUSH_PROGRESS_INDETERMINATE = 3;
}

message TagOperationProgress {
  repeated string created_refs = 1;
  TagRemotePushProgress remote_push = 2;
  repeated string pushed_or_attempted_refs = 3;
}

message AddTagResponse {
  TagActionStatus status = 1;
  string detail = 2;
  TagOperationProgress progress = 3;
}

message PushTagsResponse {
  TagActionStatus status = 1;
  string detail = 2;
  TagOperationProgress progress = 3;
}

message AddAndPushTagResponse {
  TagActionStatus status = 1;
  string detail = 2;
  TagOperationProgress progress = 3;
}

message LabelTagResponse {
  TagActionStatus status = 1;
  string detail = 2;
  TagOperationProgress progress = 3;
}

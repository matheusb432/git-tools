[package]
name = "gtl-web"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
dioxus = { version = "0.7.10", features = ["router"] }
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", rev = "bf007c15d0cf4d04d3181cc46cf12325aa773955", version = "0.0.1", default-features = false }
gtl-contracts.workspace = true
gtl-web-contracts.workspace = true
lucide-dioxus = { version = "3.26.0", features = [
  "account",
  "arrows",
  "development",
  "files",
  "layout",
  "notifications",
  "text",
  "time",
] }
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true

[features]
default = ["web"]
web = ["dioxus/web"]

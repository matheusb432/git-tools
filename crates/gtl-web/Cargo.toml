[package]
name = "gtl-web"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
dioxus = "0.7.10"
dioxus-sdk-time = "0.7.0"
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", rev = "bf007c15d0cf4d04d3181cc46cf12325aa773955", version = "0.0.1", default-features = false }
gtl-wire.workspace = true
gtl-parser.workspace = true
gtl-web-contracts.workspace = true
js-sys = { version = "0.3.102", default-features = false, features = [
  "std",
], optional = true }
lucide-dioxus = { version = "3.26.0", features = [
  "account",
  "arrows",
  "development",
  "files",
  "layout",
  "notifications",
  "text",
  "time",
] }
serde.workspace = true
serde_json.workspace = true
serde-wasm-bindgen = { version = "0.6.5", optional = true }
wasm-bindgen = "0.2.125"
wasm-bindgen-futures = "0.4.75"
web-sys = { version = "0.3.102", features = [
  "Clipboard",
  "CssStyleDeclaration",
  "Document",
  "Element",
  "HtmlDetailsElement",
  "HtmlDialogElement",
  "HtmlDocument",
  "HtmlElement",
  "HtmlTextAreaElement",
  "Navigator",
  "Node",
  "Window",
] }

[lints]
workspace = true

[features]
default = ["desktop"]
artifact = ["web", "dep:js-sys", "gtl-parser/syntax"]
desktop = [
  "web",
  "dioxus/router",
  "dep:js-sys",
  "dep:serde-wasm-bindgen",
  "gtl-parser/bundled-syntaxes",
]
web = ["dioxus/web"]

[[bin]]
name = "gtl-web"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "gtl-artifact"
path = "src/artifact_main.rs"
required-features = ["artifact"]

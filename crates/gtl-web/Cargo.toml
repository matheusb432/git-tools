[package]
name = "gtl-web"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
dioxus = "0.7.10"
dioxus-ssr = { version = "0.7.10", optional = true }
dioxus-sdk-time = "0.7.0"
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", rev = "bf007c15d0cf4d04d3181cc46cf12325aa773955", version = "0.0.1", default-features = false }
gtl-client = { workspace = true, optional = true, features = ["viewer-web"] }
gtl-models.workspace = true
gtl-wire.workspace = true
gtl-web-contracts.workspace = true
lucide-dioxus = { version = "3.26.0", features = [
  "account",
  "arrows",
  "development",
  "files",
  "layout",
  "notifications",
  "text",
  "time",
] }
serde.workspace = true
serde_json.workspace = true
serde-wasm-bindgen = { version = "0.6.5", optional = true }
wasm-bindgen = "0.2.125"
wasm-bindgen-futures = "0.4.75"
web-sys = { version = "0.3.102", features = [
  "Clipboard",
  "CssStyleDeclaration",
  "Document",
  "Element",
  "HtmlDetailsElement",
  "HtmlDialogElement",
  "HtmlDocument",
  "HtmlElement",
  "HtmlTextAreaElement",
  "Navigator",
  "Node",
  "Window",
] }
thiserror = { workspace = true, optional = true }

[dev-dependencies]
dioxus-ssr = "0.7.10"

[lints]
workspace = true

[features]
default = ["desktop"]
artifact = ["dep:dioxus-ssr", "dep:thiserror"]
desktop = ["web", "dioxus/router", "dep:gtl-client", "dep:serde-wasm-bindgen"]
web = ["dioxus/web"]

[[bin]]
name = "gtl-web"
path = "src/main.rs"
required-features = ["desktop"]

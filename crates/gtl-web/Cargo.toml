[package]
name = "gtl-web"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
dioxus = "0.7.10"
dioxus-sdk-time = "0.7.0"
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", rev = "bf007c15d0cf4d04d3181cc46cf12325aa773955", version = "0.0.1", default-features = false }
gtl-contracts.workspace = true
gtl-parser = { workspace = true, features = ["bundled-syntaxes"] }
gtl-web-contracts = { workspace = true, optional = true }
js-sys = { version = "0.3.102", default-features = false, features = ["std"] }
lucide-dioxus = { version = "3.26.0", features = [
  "account",
  "arrows",
  "development",
  "files",
  "layout",
  "notifications",
  "text",
  "time",
] }
serde.workspace = true
serde_json.workspace = true
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.125"
wasm-bindgen-futures = "0.4.75"
web-sys = { version = "0.3.102", features = [
  "Clipboard",
  "CssStyleDeclaration",
  "Document",
  "Element",
  "HtmlDetailsElement",
  "HtmlDialogElement",
  "HtmlDocument",
  "HtmlElement",
  "HtmlTextAreaElement",
  "Navigator",
  "Node",
  "Window",
] }

[lints]
workspace = true

[features]
default = ["desktop"]
desktop = ["web", "dioxus/router", "dep:gtl-web-contracts"]
web = ["dioxus/web"]

[[bin]]
name = "gtl-web"
path = "src/main.rs"
required-features = ["desktop"]

[package]
name = "gtl-web"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
dioxus = { workspace = true, features = ["lib"] }
dioxus-ssr = { version = "0.7.10", optional = true }
dioxus-sdk-time = "0.7.0"
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", rev = "bf007c15d0cf4d04d3181cc46cf12325aa773955", version = "0.0.1", default-features = false }
dx-preview = { workspace = true, optional = true }
gtl-client = { workspace = true, optional = true, features = ["viewer-ipc"] }
gtl-models.workspace = true
gtl-wire.workspace = true
gtl-web-contracts.workspace = true
lucide-dioxus = { version = "3.26.0", features = [
  "account",
  "arrows",
  "development",
  "devices",
  "files",
  "layout",
  "notifications",
  "text",
  "time",
] }
serde.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = [
  "Clipboard",
  "ClipboardEvent",
  "CssStyleDeclaration",
  "DataTransfer",
  "Document",
  "Element",
  "HtmlDetailsElement",
  "HtmlDialogElement",
  "HtmlDocument",
  "HtmlElement",
  "HtmlTextAreaElement",
  "Location",
  "Navigator",
  "Node",
  "NodeList",
  "Selection",
  "Window",
] }
thiserror = { workspace = true, optional = true }

[dev-dependencies]
dioxus-ssr = "0.7.10"

[lints]
workspace = true

[features]
default = ["desktop"]
artifact = ["dep:dioxus-ssr", "dep:thiserror"]
component-preview = [
  "artifact",
  "dep:dx-preview",
  "dx-preview/catalog",
  "interactive-ui",
  "web",
]
desktop = ["interactive-ui", "web", "dioxus/router", "dep:gtl-client"]
interactive-ui = []
web = ["dioxus/launch", "dioxus/web"]

[[bin]]
name = "gtl-web"
path = "src/main.rs"
required-features = ["desktop"]

[[example]]
name = "component-preview"
path = "dev/main.rs"
required-features = ["component-preview"]

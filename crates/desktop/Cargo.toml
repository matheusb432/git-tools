[package]
name = "desktop"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "gtl-viewer"
path = "src/main.rs"

[lib]
name = "desktop"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
application = { path = "../application" }
cqrsy = { git = "file:///workspace/shared-libs/cqrsy", tag = "v0.3.0", features = [
  "derive",
] }
domain = { path = "../domain" }
gtl-platform = { path = "../../shared/gtl-platform" }
gtl-recipe = { path = "../../shared/gtl-recipe" }
infra = { path = "../infra" }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"

[features]
# Production/standalone builds must enable this so tauri's build.rs sets
# cfg(dev)=false and the exe serves the embedded frontend via the tauri custom
# protocol instead of devUrl. `just build`/install pass it explicitly (we do not
# use the `tauri` CLI). Omitting it ships an exe that hits localhost.
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
application = { path = "../application", features = ["testing"] }

[lints]
workspace = true

[package]
name = "desktop"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "gtl-viewer"
path = "src/main.rs"

[lib]
name = "desktop"
path = "src/lib.rs"

[[bench]]
name = "viewer_render"
harness = false
required-features = ["benchmark-support"]

[build-dependencies]
serde.workspace = true
tauri-build.workspace = true
toml.workspace = true
url.workspace = true

[dependencies]
anyhow.workspace = true
application.workspace = true
domain.workspace = true
gtl-platform.workspace = true
gtl-recipe.workspace = true
infra.workspace = true
lru.workspace = true
maud.workspace = true
preview.workspace = true
raw-window-handle.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { workspace = true, features = ["tray-icon"] }
tauri-plugin-single-instance.workspace = true

[features]
benchmark-support = []
# Production/standalone builds must enable this so tauri's build.rs sets
# cfg(dev)=false and the exe serves the embedded frontend via the tauri custom
# protocol instead of devUrl. `just build`/install pass it explicitly (we do not
# use the `tauri` CLI). Omitting it ships an exe that hits localhost.
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
application = { workspace = true, features = ["testing"] }
criterion.workspace = true
sha2.workspace = true
tempfile.workspace = true
toml.workspace = true
url.workspace = true

[lints]
workspace = true

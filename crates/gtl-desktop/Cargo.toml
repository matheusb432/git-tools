[package]
name = "gtl-desktop"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "gtl-viewer"
path = "src/main.rs"

[lib]
name = "gtl_desktop"
path = "src/lib.rs"

[build-dependencies]
anyhow.workspace = true
tauri-build = { workspace = true, features = ["codegen"] }

[dependencies]
anyhow.workspace = true
gtl-client.workspace = true
gtl-wire.workspace = true
raw-window-handle.workspace = true
serde.workspace = true
tauri = { workspace = true, features = ["tray-icon"] }
tauri-plugin-single-instance.workspace = true
tauri-plugin-dialog = "2.7.3"
tokio = { workspace = true, features = ["rt", "sync", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk.workspace = true
x11-dl.workspace = true

[features]
# Production/standalone builds must enable this so tauri's build.rs sets
# cfg(dev)=false and the exe serves the embedded frontend via the tauri custom
# protocol instead of devUrl. `just build`/install pass it explicitly (we do not
# use the `tauri` CLI). Omitting it ships an exe that hits localhost.
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
toml.workspace = true

[lints]
workspace = true

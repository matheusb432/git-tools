[package]
name = "gtl-desktop"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "gtl-viewer"
path = "src/main.rs"

[lib]
name = "gtl_desktop"
path = "src/lib.rs"

[build-dependencies]
anyhow.workspace = true
serde.workspace = true
tauri-build.workspace = true
toml.workspace = true
url.workspace = true

[dependencies]
anyhow.workspace = true
gtl-application.workspace = true
gtl-contracts.workspace = true
gtl-models.workspace = true
gtl-infra.workspace = true
lru.workspace = true
maud.workspace = true
gtl-preview.workspace = true
raw-window-handle.workspace = true
serde.workspace = true
serde_json.workspace = true
strum.workspace = true
tauri = { workspace = true, features = ["tray-icon"] }
tauri-plugin-single-instance.workspace = true
url.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
x11-dl.workspace = true

[features]
benchmark-support = []
dioxus-poc = []
# Production/standalone builds must enable this so tauri's build.rs sets
# cfg(dev)=false and the exe serves the embedded frontend via the tauri custom
# protocol instead of devUrl. `just build`/install pass it explicitly (we do not
# use the `tauri` CLI). Omitting it ships an exe that hits localhost.
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
sha2.workspace = true
tempfile.workspace = true
toml.workspace = true

[lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "allow"
dbg_macro = "warn"
disallowed_methods = "deny"
cognitive_complexity = "warn"
branches_sharing_code = "warn"
collection_is_never_read = "warn"
must_use_candidate = "allow"
missing_errors_doc = "allow"

[profile.dev]
incremental = true

[profile.test]
incremental = true

# Link the MSVC runtime statically so Windows executables need no redistributable.
# cargo-xwin's CRT archives reference unavailable Microsoft PDBs; suppress LNK4099
# for those missing debug references.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-arg=/ignore:4099"]

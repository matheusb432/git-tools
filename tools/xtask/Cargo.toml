[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
# Embedded dev-automation crate (ADR-0010): never published, never installed. It is a
# workspace member built on demand via `cargo run -p xtask -- <verb>`. Add it to the
# host workspace's root `Cargo.toml` `members` list (e.g. `tools/xtask`).
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

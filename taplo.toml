# Repo-level TOML formatting so *.toml diffs stay lean and consistent.
# Run via `just fmt` (taplo fmt) / check via `just fmt-check`.
include = ["**/*.toml"]
# Build output (e.g. Tauri's autogenerated permission TOMLs under target/) is not ours to format.
exclude = ["target/**"]

[formatting]
align_entries = false
array_auto_expand = true
indent_string = "  "
reorder_keys = false
trailing_newline = true

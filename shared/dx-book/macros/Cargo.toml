[package]
name = "dx-book-macros"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro-crate = "3.5.0"
proc-macro2 = "1.0.106"
prettyplease = "0.3.0"
quote = "1.0.46"
syn = { version = "3.0.3", default-features = false, features = [
  "clone-impls",
  "full",
  "parsing",
  "printing",
  "proc-macro",
] }

[dev-dependencies]
dioxus = { workspace = true, features = ["lib"] }
storybook = { package = "dx-book", path = ".." }
trybuild = "1.0.120"

[lints]
workspace = true

[package]
name = "gtl-platform"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.102"
directories = "6.0.0"

# X11 EWMH window activation (focus over fullscreen). Runtime dlopen of libX11 —
# no link-time X headers. Already in the tree via the desktop viewer's tao/wry.
[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2.21.0"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

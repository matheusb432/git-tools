# dark (default) | mirage | glacier | graphite | carbon
theme = "dark"

# unified | split
layout = "unified"

# compact | full
density = "compact"

[keybindings]
search_files = "ctrl+p"
search_text_in_all_files = "ctrl+f"

[push]
# Defaults to true when omitted.
confirm = true

[viewer_push]
# Independent of CLI confirmation; defaults to true when omitted.
confirm = true

[tags]
default = "semver"
[tags.patterns]
semver = "v{major}.{minor}.{patch}"
bare = "{major}.{minor}.{patch}"
release = "release-{major}.{minor}.{patch}"
alpha = "{major}.{minor}.{patch}-alpha.{n}.{n}"

[[projects]]
name = "git-tools"
excluded_from_push_all = true
# overrides [tags] and [tags.patterns]
[projects.tags]
default = "dev"
[projects.tags.patterns]
dev = "{major}.{minor}.{patch}"
release = "release-{major}.{minor}.{patch}"

# dark | light | hearth | mirage | glacier | noir | graphite
theme = "dark"

# unified | split
layout = "unified"

# compact | full
density = "compact"

[keybindings]
search_files = "ctrl+p"
search_text_in_all_files = "ctrl+f"

[push]
# Plain current-repo push only; defaults to true when omitted.
confirm = true

# Default diff exclusions for projects without an explicit override.
# Extensions are case-insensitive; a leading dot is optional.
[diff]
exclude = ["md", "lock"]

# Named project settings use one array entry per exact, case-sensitive sample_project project name.
# Unknown project names are valid and remain inactive until sample_project lists them.
[[projects]]
name = "git-tools"
# Omit this repository from gtl push --all before any Git operation.
excluded_from_push_all = true
# A project override replaces the default extension list instead of merging.
diff = { exclude = ["md", "lock", "js"] }

[package]
name = "error-meta"
version = "0.1.0"
edition = "2024"
license.workspace = true
rust-version = "1.98"
publish = false
description = "Derive public and private error classifications"

[lib]
proc-macro = true

[features]
default = ["crate-discovery"]
crate-discovery = ["dep:proc-macro-crate"]

[dependencies]
proc-macro-crate = { version = "3.5.0", optional = true }
proc-macro2 = "1.0.106"
quote = "1.0.46"
syn = { version = "3.0.6", default-features = false, features = [
  "derive",
  "full",
  "parsing",
  "printing",
  "proc-macro",
] }

[dev-dependencies]
thiserror = "2.0.18"
trybuild = "1.0.121"

[lints]
workspace = true

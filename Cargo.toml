[workspace]
resolver = "3"
members = [
  "crates/cli",
  "crates/desktop",
  "crates/infra",
  "shared/cqrs",
  "shared/cqrs-core",
  "shared/cqrs-macros",
  "shared/gtl-platform",
  "tools/xtask",
]
# Everything except `desktop`, which needs webkit2gtk headers and stays opt-in
# via `-p desktop` (matching the pre-virtualization behavior of bare cargo).
default-members = [
  "crates/cli",
  "crates/infra",
  "shared/cqrs",
  "shared/cqrs-core",
  "shared/cqrs-macros",
  "shared/gtl-platform",
  "tools/xtask",
]

[profile.release]
strip = true

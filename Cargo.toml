[workspace]
resolver = "3"
members = [
  "crates/application",
  "crates/cli",
  "crates/contracts",
  "crates/daemon",
  "crates/desktop",
  "crates/domain",
  "crates/e2e",
  "crates/infra",
  "shared/bootstrap",
  "shared/gtl-platform",
  "shared/gtl-recipe",
  "xtask",
]
# Everything except `desktop`, which needs webkit2gtk headers and stays opt-in
# via `-p desktop` (matching the pre-virtualization behavior of bare cargo).
default-members = [
  "crates/application",
  "crates/cli",
  "crates/contracts",
  "crates/daemon",
  "crates/domain",
  "crates/e2e",
  "crates/infra",
  "shared/bootstrap",
  "shared/gtl-platform",
  "shared/gtl-recipe",
  "xtask",
]

[profile.release]
strip = true

# Real delta over clippy defaults is `pedantic = warn`; group levels sit low so per-lint overrides win.
[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
# Stays fatal despite `all = warn`.
correctness = { level = "deny", priority = -1 }
# Keeps clippy.toml's disallowed methods hard errors in local runs, not just under `-D warnings`.
disallowed_methods = "deny"
# Heuristic and over-flags; real "ignored value" safety is rustc's `unused_must_use`.
must_use_candidate = "allow"
missing_errors_doc = "allow"

[package]
name = "git-tools"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "git-tools"
path = "src/main.rs"

[lib]
name = "git_tools"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
strip = true

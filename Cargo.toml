[workspace]
resolver = "3"
members = [
  "benchmarks",
  "crates/gtl-application",
  "crates/gtl-cli",
  "crates/gtl-contracts",
  "crates/gtl-daemon",
  "crates/gtl-desktop",
  "crates/gtl-models",
  "crates/gtl-infra",
  "crates/gtl-preview",
  "e2e/gtl-browser-e2e",
  "e2e/gtl-cli-e2e",
  "e2e/gtl-desktop-e2e",
  "xtask",
  "crates/gtl-web",
]
# Desktop and Criterion targets need webkit2gtk headers, so their packages are not default members.
# xtask still uses the lightweight benchmark catalogue.
default-members = [
  "crates/gtl-application",
  "crates/gtl-cli",
  "crates/gtl-contracts",
  "crates/gtl-daemon",
  "crates/gtl-models",
  "crates/gtl-infra",
  "crates/gtl-preview",
  "xtask",
]

[workspace.package]
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
anyhow = "1"
gtl-application = { path = "crates/gtl-application" }
gtl-benchmarks = { path = "benchmarks" }
assert_cmd = "2"
axum = "0.8"
base64 = "0.22.1"
cargo_metadata = "0.23.1"
clap = { version = "4", features = ["derive"] }
# cargo's own clap help palette, so every workspace binary's `--help` renders like cargo's.
clap-cargo = "0.18.3"
command-group = "5.0.1"
console = { version = "0.16.4", default-features = false, features = ["std"] }
gtl-contracts = { path = "crates/gtl-contracts" }
gtl-desktop = { path = "crates/gtl-desktop" }
cqrsy = { git = "file:///workspace/shared-libs/cqrsy", tag = "v0.10.0" }
criterion = "0.8.2"
directories = "6.0.0"
gtl-models = { path = "crates/gtl-models" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
gix = { version = "0.56", default-features = false, features = ["revision"] }
http-body-util = "0.1"
ico = "0.5"
image = { version = "0.25", default-features = false, features = ["png"] }
indicatif = { version = "0.18.6", default-features = false }
gtl-infra = { path = "crates/gtl-infra" }
jiff = { version = "0.2", default-features = false, features = ["std"] }
lru = "0.18.1"
libc = "0.2.186"
maud = "0.27"
natord = "1.0.9"
nutype = "0.7.0"
parking_lot = "0.12.5"
playwright-rs = "=0.15.0"
predicates = "3"
gtl-preview = { path = "crates/gtl-preview" }
raw-window-handle = "0.6"
reqwest = { version = "0.13", default-features = false, features = [
  "blocking",
  "json",
] }
rusqlite = { version = "0.40", default-features = false, features = [
  "bundled",
  "cache",
] }
rusqlite_migration = "2.6"
scraper = "0.27.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_with = { version = "3", default-features = false, features = ["macros"] }
semver = "1.0.28"
shlex = "2.0.1"
sha2 = "0.11.0"
similar = "3.1.1"
strum = { version = "0.28.0", default-features = false, features = ["derive"] }
syntect = { version = "5.3.0", default-features = false, features = [
  "parsing",
  "regex-fancy",
  "dump-load",
] }
tauri = "2"
tauri-build = "2"
tauri-plugin-single-instance = "2"
tempfile = "3.27.0"
thirtyfour = { version = "=0.37.4", default-features = false, features = [
  "rustls",
] }
thiserror = "2.0.18"
tiny-skia = "0.12"
tokio = "1"
toml = "1.1.2"
toml_edit = "0.25.12"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1", features = ["v4"] }
walkdir = "2.5.0"
which = "8.0.4"
x11-dl = "2.21.0"
zbus = "5.16.0"
sample_project = { git = "ssh://git@github.com/matheusb432/sample_project.git", tag = "v0.6.0" }

[profile.dev.package."*"]
debug = false

[profile.test.package."*"]
debug = false

[profile.release]
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"
[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
dbg_macro = "warn"
disallowed_methods = "deny"
cognitive_complexity = "warn"
branches_sharing_code = "warn"
collection_is_never_read = "warn"
must_use_candidate = "allow"
missing_errors_doc = "allow"

[workspace]
resolver = "3"
members = [
  "benchmarks",
  "crates/gtl-application",
  "crates/gtl-cli",
  "crates/gtl-client",
  "crates/gtl-local-transport",
  "crates/gtl-wire",
  "crates/gtl-server",
  "crates/gtl-desktop",
  "crates/gtl-models",
  "crates/gtl-infra",
  "crates/gtl-parser",
  "crates/gtl-artifacts",
  "crates/gtl-web",
  "crates/gtl-web-contracts",
  "e2e/gtl-browser-e2e",
  "e2e/gtl-desktop-e2e",
  "xtask",
]
# Desktop and Criterion targets need webkit2gtk headers, so their packages are not default members.
default-members = [
  "crates/gtl-application",
  "crates/gtl-cli",
  "crates/gtl-client",
  "crates/gtl-local-transport",
  "crates/gtl-wire",
  "crates/gtl-server",
  "crates/gtl-models",
  "crates/gtl-infra",
  "crates/gtl-parser",
  "crates/gtl-artifacts",
  "xtask",
]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
gtl-application = { path = "crates/gtl-application" }
gtl-benchmarks = { path = "benchmarks" }
gtl-client = { path = "crates/gtl-client" }
gtl-local-transport = { path = "crates/gtl-local-transport" }
gtl-wire = { path = "crates/gtl-wire", default-features = false }
gtl-desktop = { path = "crates/gtl-desktop" }
gtl-artifacts = { path = "crates/gtl-artifacts" }
gtl-models = { path = "crates/gtl-models" }
gtl-parser = { path = "crates/gtl-parser", default-features = false }
gtl-server = { path = "crates/gtl-server" }
gtl-infra = { path = "crates/gtl-infra" }
gtl-web = { path = "crates/gtl-web", default-features = false }
gtl-web-contracts = { path = "crates/gtl-web-contracts" }
dx-story = "0.1.0"
error-meta = { path = "../../shared-libs/error-meta" }

anyhow = "1"
assert_cmd = "2"
base64 = "0.22.1"
blake3 = "1.8.7"
cargo_metadata = "0.23.1"
clap = { version = "4", features = ["derive"] }
# cargo's own clap help palette, so every workspace binary's `--help` renders like cargo's.
clap-cargo = "0.18.3"
command-group = "5.0.1"
console = { version = "0.16.4", default-features = false, features = ["std"] }
cqrsy = "0.11.0"
criterion = "0.8.2"
directories = "6.0.0"
dunce = "1.0.5"
dialoguer = { version = "0.12.0", default-features = false }
expectrl = "0.9.0"
dioxus = { version = "0.7.10", default-features = false }
futures-channel = "0.3"
futures = { version = "0.3", default-features = false, features = ["std"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
gtk = "0.18.2"
flate2 = { version = "1.1.9", default-features = false, features = [
  "rust_backend",
] }
gix = { version = "0.87.1", default-features = false, features = [
  "revision",
  "sha1",
  "status",
] }
ico = "0.5"
image = { version = "0.25", default-features = false, features = ["png"] }
hyper-util = { version = "0.1.20", default-features = false }
indicatif = { version = "0.18.6", default-features = false }
jiff = { version = "0.2", default-features = false }
js-sys = { version = "0.3.102", default-features = false, features = ["std"] }
lru = "0.18.1"
libc = "0.2.186"
natord = "1.0.9"
notify = { version = "8.2.0", default-features = false }
nutype = "0.7.0"
parking_lot = "0.12.5"
prost = "0.14.4"
prost-types = "0.14.4"
playwright-rs = "=0.15.0"
predicates = "3"
raw-window-handle = "0.6"
rolling-file = "0.2.0"
rusqlite = { version = "0.40", default-features = false, features = [
  "bundled",
  "cache",
] }
rusqlite_migration = "2.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde-wasm-bindgen = "0.6.5"
serde_with = { version = "3", default-features = false, features = ["macros"] }
serial_test = { version = "4.0.1", default-features = false, features = [
  "async",
] }
shlex = "2.0.1"
sha2 = "0.11.0"
similar = { version = "3.1.1", default-features = false, features = ["text"] }
strum = { version = "0.28.0", default-features = false, features = ["derive"] }
sysinfo = { version = "0.39.6", default-features = false, features = [
  "system",
] }
tauri = "2"
tauri-build = "2"
tauri-plugin-single-instance = "2"
tempfile = "3.27.0"
thirtyfour = { version = "=0.37.4", default-features = false, features = [
  "rustls",
] }
thiserror = "2.0.18"
resvg = { version = "0.48.1", default-features = false }
tokio = "1"
tokio-stream = "0.1.18"
toml = "1.1.2"
toml_edit = "0.25.12"
tonic = { version = "0.14.6", default-features = false, features = ["codegen"] }
tonic-health = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tonic-reflection = "0.14.6"
tonic-types = "0.14.6"
tower = { version = "0.5.3", default-features = false }
tower-http = { version = "0.7.0", default-features = false, features = [
  "trace",
] }
tracing = "0.1"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tree-sitter = "0.26.12"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-cpp = "0.23.4"
tree-sitter-highlight = "0.26.12"
tree-sitter-html = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-md = "0.5.3"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-swift = "0.7.3"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"
unicase = "2.9.0"
uuid = { version = "1", features = ["v4"] }
wasm-bindgen = "0.2.125"
wasm-bindgen-futures = "0.4.75"
web-sys = "0.3.102"
walkdir = "2.5.0"
windows-sys = "0.61.2"
x11-dl = "2.21.0"
zbus = "5.16.0"

[profile.dev.package."*"]
debug = false
opt-level = 3

[profile.test.package."*"]
debug = false

[profile.release]
strip = "symbols"

# Preserve wasm-bindgen metadata until Dioxus finishes processing the WASM module.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"
[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
dbg_macro = "warn"
disallowed_methods = "deny"
collection_is_never_read = "warn"
missing_errors_doc = "allow"
struct_field_names = "allow"

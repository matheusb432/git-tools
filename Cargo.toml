[workspace]
resolver = "3"
members = [
  "crates/application",
  "crates/cli",
  "crates/contracts",
  "crates/daemon",
  "crates/desktop",
  "crates/domain",
  "crates/e2e",
  "crates/infra",
  "crates/preview",
  "shared/bootstrap",
  "shared/gtl-platform",
  "shared/gtl-recipe",
  "xtask",
]
# Everything except `desktop`, which needs webkit2gtk headers and stays opt-in
# via `-p desktop` (matching the pre-virtualization behavior of bare cargo).
default-members = [
  "crates/application",
  "crates/cli",
  "crates/contracts",
  "crates/daemon",
  "crates/domain",
  "crates/e2e",
  "crates/infra",
  "crates/preview",
  "shared/bootstrap",
  "shared/gtl-platform",
  "shared/gtl-recipe",
  "xtask",
]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1"
application = { path = "crates/application" }
assert_cmd = "2"
axum = "0.8"
base64 = "0.22.1"
bootstrap = { path = "shared/bootstrap" }
cargo_metadata = "0.23.1"
clap = { version = "4", features = ["derive"] }
# cargo's own clap help palette, so every workspace binary's `--help` renders like cargo's.
clap-cargo = "0.18.3"
command-group = "5.0.1"
contracts = { path = "crates/contracts" }
cqrsy = { git = "file:///workspace/shared-libs/cqrsy", tag = "v0.10.0" }
criterion = "0.8.2"
directories = "6.0.0"
domain = { path = "crates/domain" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
gtl-platform = { path = "shared/gtl-platform" }
gtl-recipe = { path = "shared/gtl-recipe" }
http-body-util = "0.1"
ico = "0.5"
image = { version = "0.25", default-features = false, features = ["png"] }
infra = { path = "crates/infra" }
jiff = { version = "0.2", default-features = false, features = ["std"] }
lru = "0.18.1"
maud = "0.27"
natord = "1.0.9"
nutype = "0.7.0"
parking_lot = "0.12.5"
predicates = "3"
preview = { path = "crates/preview" }
raw-window-handle = "0.6"
reqwest = { version = "0.13", default-features = false, features = [
  "blocking",
  "json",
] }
rusqlite = { version = "0.40", default-features = false, features = [
  "bundled",
  "cache",
] }
rusqlite_migration = "2.6"
scraper = "0.27.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_with = { version = "3", default-features = false, features = ["macros"] }
sha2 = "0.11.0"
similar = "3.1.1"
strum = { version = "0.28.0", default-features = false, features = ["derive"] }
syntect = { version = "5.3.0", default-features = false, features = [
  "parsing",
  "regex-fancy",
  "dump-load",
] }
tauri = "2"
tauri-build = "2"
tauri-plugin-single-instance = "2"
tempfile = "3.27.0"
thiserror = "2.0.18"
tiny-skia = "0.12"
tokio = "1"
toml = "1.1.2"
toml_edit = "0.25.12"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1", features = ["v4"] }
walkdir = "2.5.0"
which = "8.0.4"
x11-dl = "2.21.0"
zbus = "5.16.0"

[profile.release]
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"

# Avoid tweaking, prefer fixing the lints.
[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
disallowed_methods = "deny"
cognitive_complexity = "warn"
branches_sharing_code = "warn"
collection_is_never_read = "warn"
must_use_candidate = "allow"
missing_errors_doc = "allow"

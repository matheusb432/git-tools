[package]
name = "gtl-desktop-e2e"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
autotests = false

[features]
e2e = []

[dev-dependencies]
sample_project-local-auth.workspace = true
sample_project-wire.workspace = true
tokio-stream.workspace = true
tonic = { workspace = true, features = ["router", "transport"] }
tonic-health.workspace = true
anyhow.workspace = true
command-group.workspace = true
futures-util.workspace = true
gtl-benchmarks.workspace = true
gtl-web-contracts.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thirtyfour.workspace = true
tokio = { workspace = true, features = [
  "macros",
  "net",
  "rt-multi-thread",
  "time",
  "sync",
] }

[[test]]
name = "viewer"
path = "tests/viewer.rs"
required-features = ["e2e"]

[lints]
workspace = true
